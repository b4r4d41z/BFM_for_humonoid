checkpoint: null
task_z: null
use_sim_time: true
control_contract_version: 4
control_architecture: decoupled_teleoperation_v1
physics_hz: 60  # Must match the training contract and external simulator configuration.
policy_hz: 15.0
max_age_s: 2.0
max_camera_skew_s: null
cameras: [head, left_wrist, right_wrist]
proprio_order: vision_proprio_v1  # Exact PROPRIO_JOINTS order from bfm/contracts/vision.py.
action_dim: 26
normalized_bounds: [-1, 1]
physical_bounds: SharpaContract  # Existing frozen per-joint arm/hand bounds.
joint_topic: /robot/state/joint_states
camera_topics:
  head: /sensors/camera/head/image_raw
  left_wrist: /sensors/camera/left_wrist/image_raw
  right_wrist: /sensors/camera/right_wrist/image_raw
output_topics:
  action: /bfm/action

# Evaluation defaults; CLI overrides these values. Safety/logging are mandatory.
mode: shadow
warmup_ticks: 10
max_policy_steps: 300
safety:
  max_arm_delta_rad: null  # Direct bridge targets: no hidden BFM slew limiter.
logging:
  output_root: runs/eval

# Inference only; checkpoint/training/cache identities remain unchanged.
inference_precision: fp32  # bf16 requires native CUDA support; fp16 is an alternative.
profile_inference: false  # Adds synchronized stage timings to ticks.jsonl.
